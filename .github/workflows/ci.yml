name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check syntax
        run: node --check app.js && node --check sw.js
      - name: Run tests
        run: npm test
      - name: Run export script
        run: node scripts/export-default-state.mjs "$RUNNER_TEMP/sampleState.json"
